<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Untukmu ♡</title>
<meta name="description" content="Sebuah surat kecil, untukmu yang istimewa.">
<meta property="og:title" content="Untukmu ♡">
<meta property="og:description" content="Sebuah surat kecil, untukmu yang istimewa.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Untukmu ♡">
<meta name="twitter:description" content="Sebuah surat kecil, untukmu yang istimewa.">
<meta name="twitter:image" content="assets/og-image.png">
<link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="preloader" id="preloader"><div class="preloader-mark">♡</div></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="bg-grain"></div>
<div class="bg-light"></div>
<div class="desk-vignette"></div>
<div class="desk-glow"></div>

<div class="desktop-decor corner-tl">
  <svg viewBox="0 0 100 100"><use href="#sprig-branch"/></svg>
</div>
<div class="desktop-decor corner-br">
  <svg viewBox="0 0 100 140"><use href="#sprig-flowers"/></svg>
</div>
<div class="desktop-decor corner-tr float-slow">
  <svg viewBox="0 0 100 140"><use href="#sprig-flowers"/></svg>
</div>
<div class="desktop-decor corner-bl float-slow delay1">
  <svg viewBox="0 0 100 100"><use href="#sprig-branch"/></svg>
</div>
<div class="desktop-decor side-l float-slow delay2">
  <svg viewBox="0 0 100 140"><use href="#sprig-flowers"/></svg>
</div>
<div class="desktop-decor side-r">
  <svg viewBox="0 0 100 100"><use href="#sprig-branch"/></svg>
</div>

<!-- reusable dried-flower sprig symbol -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="sprig-branch" viewBox="0 0 100 100">
    <path d="M10 90 C 30 70, 25 50, 45 20" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M22 62 C 30 58, 34 52, 34 46" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M30 44 C 36 40, 40 36, 41 30" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="18" r="2.4" fill="currentColor"/>
    <circle cx="34" cy="45" r="1.6" fill="currentColor"/>
    <circle cx="41" cy="29" r="1.6" fill="currentColor"/>
  </symbol>
  <symbol id="sprig-flowers" viewBox="0 0 100 140">
    <path d="M10 138 C 30 100, 40 80, 55 30" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M28 92 C 20 84, 14 78, 12 70" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M38 64 C 30 58, 24 54, 22 46" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M46 40 C 54 34, 60 30, 62 22" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <g fill="currentColor">
      <circle cx="55" cy="28" r="3"/><circle cx="62" cy="20" r="2.6"/><circle cx="48" cy="20" r="2.2"/>
      <circle cx="12" cy="68" r="2.4"/><circle cx="6" cy="62" r="2"/>
      <circle cx="22" cy="44" r="2.4"/><circle cx="16" cy="38" r="2"/>
    </g>
  </symbol>
  <symbol id="jasmine" viewBox="0 0 40 40">
    <g fill="#ece0c4" stroke="#c7ad86" stroke-width="1.1">
      <ellipse cx="20" cy="9" rx="6.5" ry="4.2" transform="rotate(0 20 20)"/>
      <ellipse cx="20" cy="9" rx="6.5" ry="4.2" transform="rotate(72 20 20)"/>
      <ellipse cx="20" cy="9" rx="6.5" ry="4.2" transform="rotate(144 20 20)"/>
      <ellipse cx="20" cy="9" rx="6.5" ry="4.2" transform="rotate(216 20 20)"/>
      <ellipse cx="20" cy="9" rx="6.5" ry="4.2" transform="rotate(288 20 20)"/>
    </g>
    <circle cx="20" cy="20" r="3.4" fill="#b98d6f"/>
  </symbol>
  <symbol id="leaf-pair" viewBox="0 0 30 20">
    <ellipse cx="6" cy="10" rx="7" ry="3" fill="#a9976f" opacity=".65" transform="rotate(-20 6 10)"/>
    <ellipse cx="24" cy="10" rx="7" ry="3" fill="#a9976f" opacity=".65" transform="rotate(20 24 10)"/>
  </symbol>
  <symbol id="vine-climb" viewBox="0 0 60 320">
    <path d="M28 318 C 18 280, 42 250, 22 210 C 8 180, 48 150, 30 110 C 14 80, 40 50, 26 10"
          stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M28 260 C 8 250, 4 235, 10 220" stroke="currentColor" stroke-width="1.1" fill="none"/>
    <path d="M24 190 C 44 182, 52 168, 46 150" stroke="currentColor" stroke-width="1.1" fill="none"/>
    <path d="M30 140 C 12 132, 6 118, 14 100" stroke="currentColor" stroke-width="1.1" fill="none"/>
    <path d="M26 70 C 46 62, 52 48, 44 32" stroke="currentColor" stroke-width="1.1" fill="none"/>
    <g fill="currentColor">
      <ellipse cx="8" cy="228" rx="7" ry="3.5" transform="rotate(-35 8 228)" opacity=".7"/>
      <ellipse cx="48" cy="158" rx="7" ry="3.5" transform="rotate(30 48 158)" opacity=".7"/>
      <ellipse cx="12" cy="108" rx="6.5" ry="3.2" transform="rotate(-40 12 108)" opacity=".7"/>
      <ellipse cx="46" cy="38" rx="6.5" ry="3.2" transform="rotate(25 46 38)" opacity=".7"/>
    </g>
    <g>
      <use href="#jasmine" x="2" y="210" width="22" height="22"/>
      <use href="#jasmine" x="36" y="140" width="24" height="24"/>
      <use href="#jasmine" x="4" y="88" width="20" height="20"/>
      <use href="#jasmine" x="34" y="22" width="22" height="22"/>
      <use href="#jasmine" x="18" y="0" width="18" height="18"/>
    </g>
  </symbol>
</svg>

<div class="stage">
  <!-- climbing vines on card edges -->
  <div class="vine vine-left" aria-hidden="true">
    <svg viewBox="0 0 60 320"><use href="#vine-climb"/></svg>
  </div>
  <div class="vine vine-right" aria-hidden="true">
    <svg viewBox="0 0 60 320"><use href="#vine-climb"/></svg>
  </div>
  <div class="vine vine-left-bottom" aria-hidden="true">
    <svg viewBox="0 0 60 320"><use href="#vine-climb"/></svg>
  </div>
  <div class="vine vine-right-bottom" aria-hidden="true">
    <svg viewBox="0 0 60 320"><use href="#vine-climb"/></svg>
  </div>

  <!-- ============ VIEW 1: COVER / PILIH SURAT ============ -->
  <section id="view-cover" class="view active">
    <div class="topbar">
      <div class="sprig" style="width:64px;height:64px;top:-6px;left:-4px;">
        <svg viewBox="0 0 100 100" style="color:var(--ink-faint); opacity:.55;"><use href="#sprig-branch"/></svg>
      </div>
      <button class="music-btn" id="musicBtn" aria-label="Putar musik lembut">
        <svg class="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <svg class="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
      <button class="dim-btn" id="dimBtn" aria-label="Mode baca redup">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </button>
      <audio id="bgAudio" src="assets/backsound.mp3" loop preload="auto"></audio>
    </div>

    <div class="garland-top">
      <svg viewBox="0 0 900 130" preserveAspectRatio="none">
        <path d="M0,10 Q225,80 450,10 Q675,80 900,10" fill="none" stroke="#b3986f" stroke-width="1.4" opacity=".7"/>
        <use href="#leaf-pair" x="45"  y="18" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="58"  y="30" width="30" height="30"/>
        <use href="#leaf-pair" x="112" y="42" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="126" y="52" width="34" height="34"/>
        <use href="#jasmine" x="210" y="62" width="38" height="38"/>
        <use href="#leaf-pair" x="255" y="50" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="300" y="52" width="34" height="34"/>
        <use href="#leaf-pair" x="352" y="34" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="368" y="28" width="30" height="30"/>
        <use href="#leaf-pair" x="495" y="18" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="508" y="30" width="30" height="30"/>
        <use href="#leaf-pair" x="562" y="42" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="576" y="52" width="34" height="34"/>
        <use href="#jasmine" x="660" y="62" width="38" height="38"/>
        <use href="#leaf-pair" x="705" y="50" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="750" y="52" width="34" height="34"/>
        <use href="#leaf-pair" x="802" y="34" width="26" height="18" opacity=".8"/>
        <use href="#jasmine" x="818" y="28" width="30" height="30"/>
      </svg>
    </div>

    <div class="title-wrap">
      <div class="title-glow"></div>
      <h1 class="title-script rise"><span>Untukmu</span><span class="heart"></span></h1>
    </div>
    <div class="title-swirl rise">
      <svg viewBox="0 0 150 20"><path d="M2 10 Q 40 20 75 10 T 148 10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
    </div>

    <p class="subtitle rise">Ada dua surat yang ingin kusampaikan.<br>Pilih salah satu untuk mulai membaca.</p>
    <div class="mini-heart rise">♡</div>

    <div class="envelope-zone rise" style="max-width:520px;">
      <div class="envelope-picker">

        <div class="envelope-option">
          <div class="envelope" id="envelope1" data-story="istimewa">
            <div class="env-back"></div>
            <div class="env-seam"><span class="line l"></span><span class="line r"></span></div>
            <div class="env-letter-peek"></div>
            <div class="env-flap"></div>
            <div class="env-text">Untukmu ♡</div>
            <div class="env-seal">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4"><use href="#sprig-branch" transform="translate(20,10) scale(0.7)"/></svg>
            </div>
            <div class="sparkle" style="top:6%; left:70%; font-size:14px; animation-delay:.2s;">✦</div>
            <div class="sparkle" style="top:12%; left:82%; font-size:10px; animation-delay:1.1s;">✦</div>
            <div class="env-flower float-slow">
              <svg viewBox="0 0 100 140" style="width:100%;height:100%;"><use href="#sprig-flowers"/></svg>
            </div>
          </div>
          <p class="env-title-label">Dia Sangat<br>Istimewa</p>
        </div>

        <div class="envelope-option">
          <div class="envelope" id="envelope2" data-story="rasa">
            <div class="env-back"></div>
            <div class="env-seam"><span class="line l"></span><span class="line r"></span></div>
            <div class="env-letter-peek"></div>
            <div class="env-flap"></div>
            <div class="env-text">Untukmu ♡</div>
            <div class="env-seal">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4"><use href="#sprig-branch" transform="translate(20,10) scale(0.7)"/></svg>
            </div>
            <div class="sparkle" style="top:6%; left:70%; font-size:14px; animation-delay:.5s;">✦</div>
            <div class="sparkle" style="top:12%; left:82%; font-size:10px; animation-delay:1.4s;">✦</div>
            <div class="env-flower float-slow delay1">
              <svg viewBox="0 0 100 140" style="width:100%;height:100%;"><use href="#sprig-flowers"/></svg>
            </div>
          </div>
          <p class="env-title-label">Sebuah Rasa yang<br>Tak Terucap</p>
        </div>

      </div>
      <p class="env-hint">Klik salah satu surat untuk membukanya</p>
      <div class="chevron">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </section>

  <!-- ============ VIEW 2: INTRO LETTER ============ -->
  <section id="view-intro" class="view">
    <div class="letter-card rise">
      <p class="letter-greet">Halo</p>
      <p class="letter-body" id="introBody"></p>
      <p class="letter-sign">- Iam</p>
      <button class="btn-primary" id="startReading">
        Mulai Membaca
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ VIEW 3: STORY READER ============ -->
  <section id="view-story" class="view">
    <div class="story-top">
      <span class="story-mark">✒</span>
      <button class="speed-btn" id="speedBtn" type="button">Baca cepat</button>
      <span class="story-progress" id="storyProgress">1 / 1</span>
    </div>
    <div class="story-center">
      <div class="story-card">
        <span class="story-deco">❧</span>
        <div class="story-text-frame">
          <p class="story-text" id="storyText"></p>
        </div>
      </div>
    </div>
    <div class="story-bottom">
      <div class="dots" id="storyDots"></div>
      <div class="story-nav">
        <button class="btn-prev hidden" id="prevBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          Kembali
        </button>
        <button class="btn-next" id="nextBtn">
          Lanjut
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ VIEW 4: CLOSING ============ -->
  <section id="view-closing" class="view">
    <div class="closing-heart rise">♡</div>
    <h2 class="closing-title rise" id="closingTitle"></h2>
    <p class="closing-sub rise" id="closingSub"></p>
    <p class="closing-sign rise">- Iam</p>
    <button class="btn-ghost rise" id="replayBtn">Pilih surat lainnya</button>
  </section>

</div>

<canvas id="particles"></canvas>

<script src="script.js"></script>
</body>
</html>
