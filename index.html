<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>She Seems Special</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grain"></div>
<div class="bg-light"></div>

<!-- reusable dried-flower sprig symbol -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="sprig-branch" viewBox="0 0 100 100">
    <path d="M10 90 C 30 70, 25 50, 45 20" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M22 62 C 30 58, 34 52, 34 46" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M30 44 C 36 40, 40 36, 41 30" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="18" r="2.4" fill="currentColor"/>
    <circle cx="34" cy="45" r="1.6" fill="currentColor"/>
    <circle cx="41" cy="29" r="1.6" fill="currentColor"/>
  </symbol>
  <symbol id="sprig-flowers" viewBox="0 0 100 140">
    <path d="M10 138 C 30 100, 40 80, 55 30" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M28 92 C 20 84, 14 78, 12 70" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M38 64 C 30 58, 24 54, 22 46" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M46 40 C 54 34, 60 30, 62 22" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
    <g fill="currentColor">
      <circle cx="55" cy="28" r="3"/><circle cx="62" cy="20" r="2.6"/><circle cx="48" cy="20" r="2.2"/>
      <circle cx="12" cy="68" r="2.4"/><circle cx="6" cy="62" r="2"/>
      <circle cx="22" cy="44" r="2.4"/><circle cx="16" cy="38" r="2"/>
    </g>
  </symbol>
</svg>

<div class="stage">

  <!-- ============ VIEW 1: COVER ============ -->
  <section id="view-cover" class="view active">
    <div class="topbar">
      <div class="sprig" style="width:64px;height:64px;top:-6px;left:-4px;">
        <svg viewBox="0 0 100 100" style="color:var(--ink-faint); opacity:.55;"><use href="#sprig-branch"/></svg>
      </div>
      <button class="music-btn" id="musicBtn" aria-label="Putar musik lembut">
        <svg class="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <svg class="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
      <audio id="bgAudio" src="assets/backsound.mp3" loop preload="auto"></audio>
    </div>

    <div class="title-wrap">
      <div class="title-glow"></div>
      <h1 class="title-script rise"><span>She Seems Special</span><span class="heart">♡</span></h1>
    </div>
    <div class="title-swirl rise">
      <svg viewBox="0 0 150 20"><path d="M2 10 Q 40 20 75 10 T 148 10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
    </div>

    <p class="subtitle rise">Sebuah cerita tentang seseorang<br>yang terlihat istimewa.</p>
    <div class="mini-heart rise">♡</div>

    <div class="envelope-zone rise">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        
        <!-- TEKS SURAT DIMASUKKAN KE DALAM KERTAS (env-letter-peek) -->
        <div class="env-letter-peek">
          <div class="env-text">Untukmu,<br>yang istimewa<br><span style="font-size:1.3rem;">♡</span></div>
        </div>
        
        <div class="env-pocket-l"></div>
        <div class="env-pocket-r"></div>
        <div class="env-flap"></div>
        <div class="env-seal">
          <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4"><use href="#sprig-branch" transform="translate(20,10) scale(0.7)"/></svg>
        </div>
        
        <div class="sparkle" style="top:6%; left:70%; font-size:14px; animation-delay:.2s;">✦</div>
        <div class="sparkle" style="top:12%; left:82%; font-size:10px; animation-delay:1.1s;">✦</div>
        
        <div class="env-flower float-slow">
          <svg viewBox="0 0 100 140" style="width:100%;height:100%;"><use href="#sprig-flowers"/></svg>
        </div>
      </div>
      <p class="env-hint">Klik surat untuk membukanya</p>
      <div class="chevron">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </section>

  <!-- ============ VIEW 2: INTRO LETTER ============ -->
  <section id="view-intro" class="view">
    <div class="letter-card rise">
      <p class="letter-greet">Halo, ♡</p>
      <p class="letter-body" id="introBody"></p>
      <p class="letter-sign">- Iam</p>
      <button class="btn-primary" id="startReading">
        Mulai Membaca
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ VIEW 3: STORY READER ============ -->
  <section id="view-story" class="view">
    <div class="story-top">
      <span class="story-mark">✒</span>
      <span class="story-progress" id="storyProgress">1 / 13</span>
    </div>
    <div class="story-center">
      <div class="story-card">
        <p class="story-text" id="storyText"></p>
      </div>
    </div>
    <div class="story-bottom">
      <div class="dots" id="storyDots"></div>
      <button class="btn-next" id="nextBtn">
        Lanjut
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ VIEW 4: CLOSING ============ -->
  <section id="view-closing" class="view">
    <div class="closing-heart rise">♡</div>
    <h2 class="closing-title rise">She Seems<br>Special.</h2>
    <p class="closing-sub rise" id="closingSub"></p>
    <p class="closing-sign rise">- Iam</p>
    <button class="btn-ghost rise" id="replayBtn">Baca ulang dari awal</button>
  </section>

</div>

<canvas id="particles"></canvas>

<script src="script.js"></script>
</body>
</html>
